[project]
name = "pathwise"
version = "0.1.0"
description = "Intelligent Code Investigation Through Connected Paths"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."] 
markers = [
    "integration: requires a running FalkorDB instance",
    "api: API endpoint tests",
]
