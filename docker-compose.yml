services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379"
    volumes:
      - falkordb_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Optional: run the full app stack with `docker compose --profile app up`
  pathwise:
    build: .
    profiles: ["app"]
    ports:
      - "8000:8000"
    depends_on:
      falkordb:
        condition: service_healthy
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - ALLOWED_ROOT=/app
    restart: unless-stopped

volumes:
  falkordb_data:
